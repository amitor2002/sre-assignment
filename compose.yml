version: "3.8"

# Production-ready SRE Assignment Stack
# Fixed version with proper network configuration and dependencies

services:
  # =============================================================================
  # TiDB DISTRIBUTED DATABASE CLUSTER
  # =============================================================================

  # PD (Placement Driver) - Cluster metadata and coordination
  pd:
    image: pingcap/pd:v6.5.0
    container_name: pd-server
    hostname: pd
    ports:
      - "2379:2379"
      - "2380:2380"
    volumes:
      - pd_data:/data
    environment:
      - TZ=UTC
    command:
      - /pd-server
      - --name=pd0
      - --data-dir=/data
      - --client-urls=http://0.0.0.0:2379
      - --peer-urls=http://0.0.0.0:2380
      - --advertise-client-urls=http://pd:2379
      - --advertise-peer-urls=http://pd:2380
      - --initial-cluster=pd0=http://pd:2380
      - --log-level=info
      - --log-file=/data/pd.log
    networks:
      - sre_network
    restart: unless-stopped

  # TiKV (Storage Engine) - Distributed key-value storage
  tikv:
    image: pingcap/tikv:v6.5.0
    container_name: tikv-server
    hostname: tikv
    ports:
      - "20160:20160"
      - "20180:20180"
    volumes:
      - tikv_data:/data
    environment:
      - TZ=UTC
    command:
      - /tikv-server
      - --pd-endpoints=http://pd:2379
      - --data-dir=/data
      - --addr=0.0.0.0:20160
      - --status-addr=0.0.0.0:20180
      - --advertise-addr=tikv:20160
      - --log-level=info
      - --log-file=/data/tikv.log
    depends_on:
      - pd
    networks:
      - sre_network
    restart: unless-stopped

  # TiDB (SQL Layer) - MySQL-compatible SQL interface
  tidb:
    image: pingcap/tidb:v6.5.0
    container_name: tidb-server
    hostname: tidb
    ports:
      - "4000:4000"
      - "10080:10080"
    environment:
      - TZ=UTC
    command:
      - /tidb-server
      - --store=tikv
      - --path=pd:2379
      - --host=0.0.0.0
      - --port=4000
      - --status=10080
      - --log-level=info
      - --log-file=/tmp/tidb.log
      - --advertise-address=tidb
    depends_on:
      - tikv
      - pd
    networks:
      - sre_network
    restart: unless-stopped

  # =============================================================================
  # MESSAGE QUEUE INFRASTRUCTURE
  # =============================================================================

  # Zookeeper - Kafka coordination service
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 5
      ZOOKEEPER_INIT_LIMIT: 10
      ZOOKEEPER_MAX_CLIENT_CNXNS: 60
      ZOOKEEPER_AUTOPURGE_SNAP_RETAIN_COUNT: 3
      ZOOKEEPER_AUTOPURGE_PURGE_INTERVAL: 24
    volumes:
      - zk_data:/var/lib/zookeeper/data
      - zk_logs:/var/lib/zookeeper/log
    networks:
      - sre_network
    restart: unless-stopped

  # Kafka - Message broker for real-time data streaming
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    volumes:
      - kafka_data:/var/lib/kafka/data
    depends_on:
      - zookeeper
    networks:
      - sre_network
    restart: unless-stopped

  # =============================================================================
  # CHANGE DATA CAPTURE & MONITORING
  # =============================================================================

  # TiCDC - Change Data Capture for real-time data synchronization
  ticdc:
    image: pingcap/ticdc:v6.5.0
    container_name: ticdc-server
    hostname: ticdc
    ports:
      - "8300:8300"
    environment:
      - TZ=UTC
    command:
      - /cdc
      - server
      - --pd=http://pd:2379
      - --addr=0.0.0.0:8300
      - --advertise-addr=ticdc:8300
      - --log-level=info
      - --log-file=/logs/ticdc.log
      - --gc-ttl=86400
      - --tz=UTC
    volumes:
      - ticdc_logs:/logs
    depends_on:
      - tidb
      - kafka
    networks:
      - sre_network
    restart: unless-stopped

  # =============================================================================
  # APPLICATION LAYER
  # =============================================================================

  # Database Initializer - Sets up schema and seed data
  db-init:
    build:
      context: ./db-init
      dockerfile: Dockerfile
    container_name: db-initializer
    environment:
      - DB_HOST=tidb
      - DB_PORT=4000
      - DB_USER=root
      - DB_PASSWORD=
      - DB_NAME=sre_app
      - TZ=UTC
    depends_on:
      - tidb
    networks:
      - sre_network
    restart: "no"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Backend API - Node.js application server
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sre-api
    hostname: api
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DB_HOST=tidb
      - DB_PORT=4000
      - DB_USER=root
      - DB_PASSWORD=
      - DB_NAME=sre_app
      - JWT_SECRET=sre-assignment-jwt-secret-change-in-production-2025
      - KAFKA_BROKER=kafka:29092
      - LOG_LEVEL=info
      - TZ=UTC
    volumes:
      - ./backend/logs:/app/logs
      - api_uploads:/app/uploads
    depends_on:
      - db-init
      - kafka
    networks:
      - sre_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # Frontend - React application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sre-frontend
    hostname: frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:3001
      - REACT_APP_VERSION=1.0.0
    depends_on:
      - api
    networks:
      - sre_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Message Consumer - Processes CDC events and user activities
  consumer:
    build:
      context: ./consumer
      dockerfile: Dockerfile
    container_name: sre-consumer
    hostname: consumer
    environment:
      - NODE_ENV=production
      - KAFKA_BROKER=kafka:29092
      - KAFKA_GROUP_ID=sre-consumer-group
      - KAFKA_TOPICS=user_activities,database_changes,tidb-cdc-events
      - LOG_LEVEL=info
      - TZ=UTC
    volumes:
      - ./consumer/logs:/app/logs
    depends_on:
      - kafka
      - api
    networks:
      - sre_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

# =============================================================================
# NETWORK CONFIGURATION - SIMPLIFIED TO SINGLE NETWORK
# =============================================================================

networks:
  # Single network for all services to avoid conflicts
  sre_network:
    driver: bridge
    name: sre_network
    ipam:
      config:
        - subnet: 172.25.0.0/16

# =============================================================================
# PERSISTENT STORAGE
# =============================================================================

volumes:
  # TiDB cluster data
  pd_data:
    driver: local
    name: sre_pd_data
  tikv_data:
    driver: local
    name: sre_tikv_data
  ticdc_logs:
    driver: local
    name: sre_ticdc_logs

  # Kafka infrastructure data
  zk_data:
    driver: local
    name: sre_zk_data
  zk_logs:
    driver: local
    name: sre_zk_logs
  kafka_data:
    driver: local
    name: sre_kafka_data

  # Application data
  api_uploads:
    driver: local
    name: sre_api_uploads

services:
  # =============================================================================
  # TiDB DISTRIBUTED DATABASE CLUSTER
  # =============================================================================

  pd:
    image: pingcap/pd:v6.5.0
    container_name: pd-server
    hostname: pd
    ports:
      - "2379:2379"
      - "2380:2380"
    volumes:
      - pd_data:/data
    environment:
      - TZ=UTC
    command:
      - --name=pd0
      - --data-dir=/data
      - --client-urls=http://0.0.0.0:2379
      - --peer-urls=http://0.0.0.0:2380
      - --advertise-client-urls=http://pd:2379
      - --advertise-peer-urls=http://pd:2380
      - --initial-cluster=pd0=http://pd:2380
    networks:
      - sre_network
    restart: unless-stopped

  tikv:
    image: pingcap/tikv:v6.5.0
    container_name: tikv-server
    hostname: tikv
    ports:
      - "20160:20160"
      - "20180:20180"
    volumes:
      - tikv_data:/data
    environment:
      - TZ=UTC
    command:
      - --pd-endpoints=http://pd:2379
      - --data-dir=/data
      - --addr=0.0.0.0:20160
      - --status-addr=0.0.0.0:20180
      - --advertise-addr=tikv:20160
    depends_on:
      - pd
    networks:
      - sre_network
    restart: unless-stopped

  tidb:
    image: pingcap/tidb:v6.5.0
    container_name: tidb-server
    hostname: tidb
    ports:
      - "4000:4000"
      - "10080:10080"
    environment:
      - TZ=UTC
    command:
      - --store=tikv
      - --path=pd:2379
      - --host=0.0.0.0
      - -P=4000
      - --status=10080
      - --advertise-address=tidb
    depends_on:
      - tikv
      - pd
    networks:
      - sre_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:10080/status || exit 1"]
      timeout: 10s
      retries: 12
      start_period: 60s
      interval: 10s

  # =============================================================================
  # MESSAGE QUEUE INFRASTRUCTURE
  # =============================================================================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 5
      ZOOKEEPER_INIT_LIMIT: 10
      ZOOKEEPER_MAX_CLIENT_CNXNS: 60
      ZOOKEEPER_AUTOPURGE_SNAP_RETAIN_COUNT: 3
      ZOOKEEPER_AUTOPURGE_PURGE_INTERVAL: 24
    volumes:
      - zk_data:/var/lib/zookeeper/data
      - zk_logs:/var/lib/zookeeper/log
    networks:
      - sre_network
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    volumes:
      - kafka_data:/var/lib/kafka/data
    depends_on:
      - zookeeper
    networks:
      - sre_network
    restart: unless-stopped

  # =============================================================================
  # CHANGE DATA CAPTURE & MONITORING
  # =============================================================================

  ticdc:
    image: pingcap/ticdc:v6.5.0
    container_name: ticdc-server
    hostname: ticdc
    ports:
      - "8300:8300"
    environment:
      - TZ=UTC
    command:
      - /cdc
      - server
      - --pd=http://pd:2379
      - --addr=0.0.0.0:8300
      - --advertise-addr=ticdc:8300
      - --gc-ttl=86400
    volumes:
      - ticdc_logs:/logs
    depends_on:
      tidb:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - sre_network
    restart: unless-stopped

  cdc-task-manager:
    image: pingcap/ticdc:v6.5.0
    container_name: cdc-task-manager
    environment:
      - TZ=UTC
      - TICDC_ADDR=http://ticdc:8300
      - KAFKA_ADDR=kafka:29092
    depends_on:
      - ticdc
    networks:
      - sre_network
    restart: "no"
    command: >
      sh -c "
        echo 'Waiting for TiCDC to be ready...' &&
        sleep 60 &&
        echo 'Creating changefeed for user activities...' &&
        /cdc cli changefeed create \
          --server=http://ticdc:8300 \
          --sink-uri='kafka://kafka:29092/user_activities?protocol=canal-json' \
          --changefeed-id='user-activities-feed' \
          --rules-filter='sre_app.users,sre_app.user_tokens,sre_app.activity_logs' &&
        echo 'Creating changefeed for database changes...' &&
        /cdc cli changefeed create \
          --server=http://ticdc:8300 \
          --sink-uri='kafka://kafka:29092/database_changes?protocol=canal-json' \
          --changefeed-id='database-changes-feed' \
          --rules-filter='sre_app.*' &&
        echo 'CDC tasks created successfully'
      "

  # =============================================================================
  # APPLICATION LAYER
  # =============================================================================

  db-init:
    build:
      context: ./db-init
      dockerfile: Dockerfile
    container_name: db-initializer
    environment:
      - DB_HOST=tidb
      - DB_PORT=4000
      - DB_USER=root
      - DB_PASSWORD=
      - DB_NAME=sre_app
      - TZ=UTC
      - WAIT_TIMEOUT=180
      - MAX_RETRIES=20
    depends_on:
      tidb:
        condition: service_healthy
    networks:
      - sre_network
    restart: "no"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sre-api
    hostname: api
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DB_HOST=tidb
      - DB_PORT=4000
      - DB_USER=root
      - DB_PASSWORD=
      - DB_NAME=sre_app
      - JWT_SECRET=sre-assignment-jwt-secret-change-in-production-2025
      - KAFKA_BROKER=kafka:29092
      - LOG_LEVEL=info
      - TZ=UTC
      - KAFKAJS_NO_PARTITIONER_WARNING=1
      - DB_CONNECTION_TIMEOUT=30000
      - DB_ACQUIRE_TIMEOUT=60000
      - DB_RECONNECT=true
    volumes:
      - ./backend/logs:/app/logs
      - api_uploads:/app/uploads
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_started
    networks:
      - sre_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sre-frontend
    hostname: frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:3001
      - REACT_APP_VERSION=1.0.0
    depends_on:
      - api
    networks:
      - sre_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  consumer:
    build:
      context: ./consumer
      dockerfile: Dockerfile
    container_name: sre-consumer
    hostname: consumer
    environment:
      - NODE_ENV=production
      - KAFKA_BROKER=kafka:29092
      - KAFKA_GROUP_ID=sre-consumer-group
      - KAFKA_TOPICS=user_activities,database_changes,tidb-cdc-events
      - LOG_LEVEL=info
      - TZ=UTC
      - KAFKAJS_NO_PARTITIONER_WARNING=1
    volumes:
      - ./consumer/logs:/app/logs
    depends_on:
      - kafka
      - api
    networks:
      - sre_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

networks:
  sre_network:
    driver: bridge
    name: sre_network
    ipam:
      config:
        - subnet: 172.25.0.0/16

volumes:
  pd_data:
    driver: local
    name: sre_pd_data
  tikv_data:
    driver: local
    name: sre_tikv_data
  ticdc_logs:
    driver: local
    name: sre_ticdc_logs
  zk_data:
    driver: local
    name: sre_zk_data
  zk_logs:
    driver: local
    name: sre_zk_logs
  kafka_data:
    driver: local
    name: sre_kafka_data
  api_uploads:
    driver: local
    name: sre_api_uploads

services:
  # PD (Placement Driver) - Required for TiDB cluster
  pd:
    image: pingcap/pd:latest
    container_name: pd-server
    ports:
      - "2379:2379"
      - "2380:2380"
    volumes:
      - pd_data:/data
    command:
      - /pd-server
      - --name=pd
      - --data-dir=/data
      - --client-urls=http://0.0.0.0:2379
      - --peer-urls=http://0.0.0.0:2380
      - --advertise-client-urls=http://pd:2379
      - --advertise-peer-urls=http://pd:2380
      - --initial-cluster=pd=http://pd:2380
      - --log-level=info
    networks:
      - sre_network
    restart: unless-stopped

  # TiKV Storage Engine - Required for TiDB cluster
  tikv:
    image: pingcap/tikv:latest
    container_name: tikv-server
    ports:
      - "20160:20160"
    volumes:
      - tikv_data:/data
    command:
      - /tikv-server
      - --pd-endpoints=http://pd:2379
      - --data-dir=/data
      - --addr=0.0.0.0:20160
      - --advertise-addr=tikv:20160
      - --log-level=info
    depends_on:
      - pd
    networks:
      - sre_network
    restart: unless-stopped

  # TiDB SQL Layer - The actual database
  tidb:
    image: pingcap/tidb:latest
    container_name: tidb-server
    ports:
      - "4000:4000"
      - "10080:10080"
    command:
      - /tidb-server
      - --store=tikv
      - --path=pd:2379
      - --host=0.0.0.0
      - --status=10080
      - --log-level=info
    depends_on:
      - tikv
      - pd
    networks:
      - sre_network
    volumes:
      - tidb_data:/var/lib/tidb
    restart: unless-stopped

  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - sre_network
    restart: unless-stopped

  # Kafka Message Broker
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: "broker"
    networks:
      - sre_network
    restart: unless-stopped

  # Database Initializer (runs first)
  db-init:
    build:
      context: ./db-init
      dockerfile: Dockerfile
    container_name: db-initializer
    environment:
      - DB_HOST=tidb
      - DB_PORT=4000
      - DB_USER=root
      - DB_PASSWORD=
      - DB_NAME=sre_app
    depends_on:
      - tidb
    networks:
      - sre_network
    restart: "no"

  # Backend API Service
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sre-api
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DB_HOST=tidb
      - DB_PORT=4000
      - DB_USER=root
      - DB_PASSWORD=
      - DB_NAME=sre_app
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - KAFKA_BROKER=kafka:9092
    depends_on:
      - tidb
      - kafka
      - db-init
    volumes:
      - ./backend/logs:/app/logs
    networks:
      - sre_network
    restart: unless-stopped

  # Database Change Consumer
  consumer:
    build:
      context: ./consumer
      dockerfile: Dockerfile
    container_name: sre-consumer
    environment:
      - NODE_ENV=production
      - KAFKA_BROKER=kafka:9092
      - KAFKA_TOPIC=tidb_changes
    depends_on:
      - kafka
    volumes:
      - ./consumer/logs:/app/logs
    networks:
      - sre_network
    restart: unless-stopped

  # Frontend React Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sre-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:3001
    depends_on:
      - api
    networks:
      - sre_network
    restart: unless-stopped

  # TiCDC for Change Data Capture (Proper implementation)
  ticdc:
    image: pingcap/ticdc:latest
    container_name: ticdc-server
    depends_on:
      - tidb
      - pd
      - tikv
      - kafka
    command:
      - /cdc
      - server
      - --pd=http://pd:2379
      - --addr=0.0.0.0:8300
      - --advertise-addr=ticdc:8300
      - --log-level=info
      - --log-file=/logs/ticdc.log
    ports:
      - "8300:8300"
    volumes:
      - ticdc_logs:/logs
    networks:
      - sre_network
    restart: unless-stopped

networks:
  sre_network:
    driver: bridge

volumes:
  pd_data:
  tikv_data:
  tidb_data:
  ticdc_logs: